# SonarQube / SonarCloud configuration for Frontend
sonar.projectKey=YOUR_GITHUB_USERNAME_secure-devops-frontend
sonar.organization=YOUR_SONAR_ORGANIZATION

sonar.projectName=Secure DevOps - Frontend
sonar.projectVersion=1.0

# Source paths
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.jsx,**/*.test.js,**/setupTests.js

# Test paths
sonar.tests=src/tests
sonar.test.inclusions=**/*.test.jsx,**/*.test.js

# Coverage report (generated by vitest --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
